name: Unpack XingZhi skill

on:
  push:
    paths:
      - xingzhi-app-ui-master-upload.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unpack self-contained skill
        run: |
          unzip -o xingzhi-app-ui-master-upload.zip
          rm xingzhi-app-ui-master-upload.zip
          rm .github/workflows/unpack-skill.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload self-contained XingZhi App UI skill"
          git push
